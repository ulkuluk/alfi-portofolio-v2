# Server block for the static build. Mirrors public/_headers (used by Cloudflare Pages).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Pages are emitted as <name>.html, so /colophon resolves to colophon.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build assets never change, so cache them for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Not hashed, so keep the cache short.
    location = /theme-init.js {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cloudflare-only config; not meant to be served.
    location = /_headers {
        return 404;
    }

    error_page 404 /404.html;
}
