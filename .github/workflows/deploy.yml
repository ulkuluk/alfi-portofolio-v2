name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      # Decide whether a deploy is possible. Skipping is not a failure: the job stays green
      # and says why in the log and the job summary.
      - name: Check deploy prerequisites
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          reason=""
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            reason="Dependabot runs have no access to deploy secrets; CI already covers these changes."
          elif [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            reason="Pull requests from forks have no access to secrets."
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            reason="Secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set."
          elif [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            reason="Repository variable CLOUDFLARE_PROJECT_NAME is not set."
          fi

          if [ -n "$reason" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::$reason"
            echo "### Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      # Only the main deploy is gated; previews may contain placeholders.
      - name: Fail on unresolved TODO placeholders
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'push'
        env:
          ALLOW_TODO: ${{ vars.ALLOW_TODO }}
        run: npm run check:todo -- --strict

      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref || github.ref_name }}
