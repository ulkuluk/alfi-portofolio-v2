name: Deploy gate

# Cloudflare Workers Builds handles the actual deploy: it listens to pushes on
# this repo and runs `npm run build` then `npx wrangler deploy` itself.
#
# This workflow's job is narrower: block a push to main when unresolved TODO
# placeholders remain (unless ALLOW_TODO=1 is set), and confirm the build still
# passes. It does not call wrangler and does not need deploy secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # PRs may contain placeholders; only main-branch pushes are blocked.
      - name: Fail on unresolved TODO placeholders (main only)
        if: github.event_name == 'push'
        env:
          ALLOW_TODO: ${{ vars.ALLOW_TODO }}
        run: npm run check:todo -- --strict

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build
