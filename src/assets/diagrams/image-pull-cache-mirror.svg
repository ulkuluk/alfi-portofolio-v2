<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="sp-title sp-desc">
  <!-- {{TODO: review diagram for accuracy}} -->
  <title id="sp-title">How a node pulls an image with Spegel</title>
  <desc id="sp-desc">containerd on a node reads mirror settings from a hosts.toml file that Spegel writes. For each pull, containerd asks the Spegel pod on its own node first. If the image is not there, Spegel asks the Spegel pods on peer nodes over a peer-to-peer protocol. Only if no peer has it does the pull go to the upstream registry.</desc>
  <defs>
    <marker id="sp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" class="d-arrow" />
    </marker>
  </defs>

  <rect class="d-box" x="20" y="20" width="260" height="64" rx="8" />
  <text class="d-title" x="150" y="47" text-anchor="middle">containerd</text>
  <text class="d-sub" x="150" y="67" text-anchor="middle">on every node</text>

  <rect class="d-box" x="320" y="20" width="140" height="64" rx="8" />
  <text class="d-title" x="390" y="47" text-anchor="middle">hosts.toml</text>
  <text class="d-sub" x="390" y="67" text-anchor="middle">written by Spegel</text>

  <rect class="d-box-accent" x="20" y="140" width="260" height="64" rx="8" />
  <text class="d-title" x="150" y="167" text-anchor="middle">Spegel pod, this node</text>
  <text class="d-sub" x="150" y="187" text-anchor="middle">DaemonSet, one per node</text>

  <rect class="d-box" x="20" y="260" width="260" height="64" rx="8" />
  <text class="d-title" x="150" y="287" text-anchor="middle">Spegel pods, peer nodes</text>
  <text class="d-sub" x="150" y="307" text-anchor="middle">peer-to-peer, no central mirror</text>

  <rect class="d-box" x="20" y="380" width="260" height="64" rx="8" />
  <text class="d-title" x="150" y="407" text-anchor="middle">Upstream registry</text>
  <text class="d-sub" x="150" y="427" text-anchor="middle">Docker Hub, GHCR, ECR</text>

  <path class="d-line" d="M320 52H284" marker-end="url(#sp-arrow)" />
  <path class="d-line" d="M150 84V136" marker-end="url(#sp-arrow)" />
  <path class="d-line" d="M150 204V256" marker-end="url(#sp-arrow)" />
  <path class="d-line" d="M150 324V376" marker-end="url(#sp-arrow)" />

  <text class="d-label" x="162" y="116">asks first</text>
  <text class="d-label" x="162" y="235">not here? ask peers</text>
  <text class="d-label" x="162" y="355">no peer has it</text>
</svg>
